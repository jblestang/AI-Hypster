[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# Relative to this crate root (crates/vm1-app/). run_qemu.sh also sets RUSTFLAGS
# when building from the workspace root.
# static: raw .bin load has no dynamic linker — PIE/GOT memcpy calls triple-fault.
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static",
]
